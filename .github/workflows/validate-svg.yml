name: Validate SVG assets
on:
  push:
    paths:
      - "assets/**/*.svg"
      - "scripts/validate_svg.py"
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  svg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python scripts/validate_svg.py
