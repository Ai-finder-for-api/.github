name: Refresh public GitHub metadata
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"
permissions:
  contents: write
concurrency:
  group: refresh-public-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch public metadata (display name and bio excluded)
        run: python scripts/generate_profile_data.py
        env:
          GITHUB_USERNAME: Ai-finder-for-api
      - name: Commit snapshot only when changed
        run: |
          if git diff --quiet -- assets/generated/profile_data.json; then
            echo "No metadata changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/profile_data.json
          git commit -m "chore: refresh public profile metadata"
          git push
